name: Champion CoreS3 (Gemini Live + Google Search)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gemini-google-search
      - feature/offline-play-mvp
      - feature/play-v2-camera-i18n
      - feature/play-v3-hardware-fixes
      - feature/play-v4-kids-dialogue-face-gate
      - feature/play-v4-face-detector-spike
    paths:
      - 'main/conversation_task.cpp'
      - 'main/device_ui.cpp'
      - 'main/play_dialogue.hpp'
      - 'main/demo_loop.cpp'
      - 'main/camera_service.cpp'
      - 'main/camera_service.hpp'
      - 'main/idf_component.yml'
      - 'sdkconfig.defaults.cores3'
      - 'main/Kconfig.projbuild'
      - 'main/CMakeLists.txt'
      - 'main/render_task.cpp'
      - 'main/ap_screen.cpp'
      - 'components/config_service/config_service.cpp'
      - 'components/config_service/include/config_service/ui_english.hpp'
      - 'main/mic_lip_sync_task.cpp'
      - 'tools/generate_play_audio.py'
      - 'main/shared_state.hpp'
      - 'components/conversation/gemini_live_client.cpp'
      - '.github/workflows/champion-cores3.yml'
      - 'champion_tests/**'
      - 'docs/CHAMPION.md'
      - 'docs/PLAY_V2.md'
      - 'docs/PLAY_V4.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.5
    timeout-minutes: 100
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node for avatar compiler
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs espeak python3-pip python3-venv curl
          node --version

      - name: Check source invariants
        shell: bash
        run: python3 -m unittest discover -s champion_tests -v

      - name: Generate natural Persian voice (Piper Mana)
        shell: bash
        run: |
          python3 -m venv /tmp/piper-python
          /tmp/piper-python/bin/python -m pip install --no-cache-dir 'piper-tts==1.8.0'
          mkdir -p /tmp/persian-voice
          curl --retry 3 --location --fail --silent --show-error \
            'https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx' \
            -o /tmp/persian-voice/fa_IR-mana-medium.onnx
          curl --retry 3 --location --fail --silent --show-error \
            'https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/main/fa_IR-mana-medium.onnx.json' \
            -o /tmp/persian-voice/fa_IR-mana-medium.onnx.json
          echo 'e390c0e74ba71fd97c49ba662ee0c6e1724b462ba2d4561698af4f564840f126  /tmp/persian-voice/fa_IR-mana-medium.onnx' | sha256sum -c -
          /tmp/piper-python/bin/python tools/generate_play_audio.py --engine piper \
            --model /tmp/persian-voice/fa_IR-mana-medium.onnx \
            --output main/play_audio_assets.hpp \
            --preview-dir build_audio_preview
          test -s main/play_audio_assets.hpp

      - name: Patch vendor library
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/components/M5Unified"
          bash tools/apply-m5-patches.sh

      - name: Build main and recovery for CoreS3
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          echo "champion-${GITHUB_SHA:0:7}" > version.txt
          cp version.txt recovery/version.txt
          make set-target BOARD=cores3
          make build BOARD=cores3
          make -C recovery set-target BOARD=cores3 IDF_PATH="$IDF_PATH"
          make -C recovery build BOARD=cores3 IDF_PATH="$IDF_PATH"

      - name: Package correct ADR-001 flash layout
        shell: bash
        run: |
          python3 script/pack_release.py --board cores3 --version "champion-${GITHUB_SHA:0:7}" --out release/cores3
          test -s release/cores3/flash_args
          test -s release/cores3/flash_manifest.json
          test -s release/cores3/recovery.bin
          test -s release/cores3/bootctl.bin
          cp docs/CHAMPION.md release/cores3/README_CHAMPION.md
          mkdir -p release/cores3/audio_preview
          cp build_audio_preview/*.wav release/cores3/audio_preview/
          test -s release/cores3/audio_preview/dali.wav
          test -s release/cores3/audio_preview/red.wav

      - name: Upload flashable firmware package
        uses: actions/upload-artifact@v4
        with:
          name: champion-cores3-firmware
          path: release/cores3/
          if-no-files-found: error
          retention-days: 30
